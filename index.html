<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profile</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

<div class="phone">

  <!-- Top bar -->
  <div class="topbar">
    <div class="xp-badge">
      <div class="Shape">
        <img src="assets/icons/starshape.svg" class="gear-icon" alt="XP">
      </div>
      <span class="XP">96 XP</span>
    </div>

    <div class="Stack">
      <img src="assets/icons/settinhg-white.svg" class="gear-icon" alt="Settings">
    </div>
  </div>

  <!-- Avatar -->
  <div class="photo-wrap">
    <img src="assets/icons/Silvia.avif" alt="Prakruti M." class="photo">
  </div>

  <!-- Name -->
  <div class="name-row">
    <h1 class="name">Prakruti M.</h1>

    <div class="verified-badge">
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="M7 12.5L10.5 16L17.5 8.5"
          stroke="#5A1295"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <p class="username">@prakruti</p>

  <!-- Stats -->
  <div class="stats-grid">

    <div class="stat-card">
      <img src="assets/icons/globalrank-shape-4.svg" class="stat-icon" alt="">
      <div class="stat-text">
        <span class="stat-label">Global rank</span>
        <span class="stat-value">39th</span>
      </div>
    </div>

    <div class="stat-card">
      <img src="assets/icons/localrank-shape-3.svg" class="stat-icon" alt="">
      <div class="stat-text">
        <span class="stat-label">Local rank</span>
        <span class="stat-value">6th</span>
      </div>
    </div>

    <div class="stat-card">
      <img src="assets/icons/streak-shape-2.svg" class="stat-icon" alt="">
      <div class="stat-text">
        <span class="stat-label">Streak</span>
        <span class="stat-value">45 days</span>
      </div>
    </div>

    <div class="stat-card">
      <img src="assets/icons/starshape.svg" class="stat-icon" alt="">
      <div class="stat-text">
        <span class="stat-label">Exp. Points</span>
        <span class="stat-value">96</span>
      </div>
    </div>

  </div>

  <!-- Badges -->
  <h2 class="badges-title">Badges Unlocked</h2>

  <div class="badges-row">
    <div class="badge badge-red"></div>
    <div class="badge badge-blue"></div>
    <div class="badge badge-green"></div>
    <div class="badge badge-purple"></div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">

    <button class="play" type="button" aria-label="Play">
      <img
        src="assets/icons/joystick1.svg"
        class="controller-icon"
        alt="">
    </button>

    <button class="analyse" type="button" aria-label="Statistics">
      <img
        src="assets/icons/barchart.svg"
        class="barchart-symbol"
        alt="">
    </button>

    <button class="profile" type="button" aria-label="Profile">
      <div class="avatar">
        <img
          src="assets/icons/Silvia.avif"
          class="avatar-img"
          alt="Profile">
      </div>
    </button>

  </nav>

</div>

</body>
</html>
