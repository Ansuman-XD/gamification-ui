<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Quiz</title>

    <link rel="stylesheet" href="styles/secondpage.css">
</head>

<body>

    <!-- Desktop shows this as a mobile-sized screen -->
    <!-- <div class="mobile-preview"> -->

        <main class="quiz-screen">

            <!-- =========================
                 TOP PROGRESS
            ========================== -->

            <div class="progress">
                2/10
            </div>


            <!-- =========================
                 TIMER
            ========================== -->

            <div class="timer">

               <img
        src="assets/Stack 4.svg"
        class="timer-icon"
        alt="Timer"
    >

            </div>


            <!-- =========================
                 MENU
            ========================== -->

            <button class="menu-button">

                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </button>


            <!-- =========================
                 QUESTION
            ========================== -->

            <div class="question">
                What is 3+5+12?
            </div>


            <!-- =========================
                 SKIP
            ========================== -->

            <button class="skip-button">
                SKIP
            </button>


            <!-- =========================
                 ANSWERS
            ========================== -->

            <div class="answers">

                <button class="answer">
                    20
                </button>

                <button class="answer selected">
                    21
                </button>

                <button class="answer">
                    23
                </button>

                <button class="answer">
                    22
                </button>

            </div>


            <!-- =========================
                 YOUR DECORATION IMAGE
            ========================== -->

            <img
                src="assets/Shape.svg"
                class="quiz-decoration"
                alt=""
            >

        </main>

    <!-- </div> -->

</body>
</html>
